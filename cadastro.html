<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Vitrine</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container form-container">
    <a class="voltar" href="index.html">← Voltar para a página inicial</a>
    <h1><span class="brand-mark">V</span>vitrine</h1>
    <h2>Crie sua conta</h2><p>Preencha os campos para começar a utilizar a plataforma.</p>
    <form id="formCadastro">
      <label for="nome">Nome completo</label><input type="text" id="nome" placeholder="Seu nome" required>
      <label for="email">E-mail</label><input type="email" id="email" placeholder="voce@exemplo.com" required>
      <label for="senha">Senha</label><input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>
      <label for="tipo">Como deseja utilizar a Vitrine?</label>
      <select id="tipo" required><option value="user">Sou cliente</option><option value="owner">Sou proprietário</option></select>
      <button type="submit" style="width:100%;margin-top:12px">Criar minha conta</button>
    </form>
    <p id="mensagem" class="mensagem" role="status"></p>
    <p>Já possui cadastro? <a href="login.html">Entrar</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script>
</body>
</html>
