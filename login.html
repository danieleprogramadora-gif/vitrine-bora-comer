<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Vitrine</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container form-container">
    <a class="voltar" href="index.html">← Voltar para a página inicial</a>
    <h1><span class="brand-mark">V</span>vitrine</h1>
    <h2>Bem-vindo de volta</h2><p>Entre com seus dados para acessar sua conta.</p>
    <form id="formLogin">
      <label for="email">E-mail</label><input type="email" id="email" placeholder="voce@exemplo.com" required>
      <label for="senha">Senha</label><input type="password" id="senha" placeholder="Digite sua senha" required>
      <button type="submit" style="width:100%;margin-top:12px">Entrar na plataforma</button>
    </form>
    <p id="mensagem" class="mensagem" role="status"></p>
    <p>Ainda não tem uma conta? <a href="cadastro.html">Criar cadastro</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script>
</body>
</html>
